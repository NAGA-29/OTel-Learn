extensions:
  file_storage:
    directory: /var/lib/otelcol/file-storage
    create_directory: true
    fsync: true
    compaction:
      on_start: true
      directory: /var/lib/otelcol/compaction

receivers:
  filelog/laravel:
    include: [/var/log/laravel/laravel.json-*.log]
    start_at: beginning
    storage: file_storage
    include_file_path: true
    operators:
      - type: json_parser
        id: parse_monolog_json
        parse_to: body
        timestamp:
          parse_from: body.datetime
          layout_type: strptime
          layout: '%Y-%m-%dT%H:%M:%S.%f%z'

processors:
  transform/redact:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          - delete_key(body["context"], "password") where IsMap(body["context"])
          - delete_key(body["context"], "authorization") where IsMap(body["context"])
          - delete_key(body["context"], "cookie") where IsMap(body["context"])
          - delete_key(body["context"], "token") where IsMap(body["context"])
          - delete_key(body["context"], "access_token") where IsMap(body["context"])
          - delete_key(body["context"], "refresh_token") where IsMap(body["context"])
  transform/normalize:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          - set(cache["raw"], body)
          - set(severity_text, cache["raw"]["level_name"])
          - set(severity_number, 5) where cache["raw"]["level_name"] == "DEBUG"
          - set(severity_number, 9) where cache["raw"]["level_name"] == "INFO"
          - set(severity_number, 10) where cache["raw"]["level_name"] == "NOTICE"
          - set(severity_number, 13) where cache["raw"]["level_name"] == "WARNING"
          - set(severity_number, 17) where cache["raw"]["level_name"] == "ERROR"
          - set(severity_number, 21) where cache["raw"]["level_name"] == "CRITICAL"
          - set(severity_number, 22) where cache["raw"]["level_name"] == "ALERT"
          - set(severity_number, 24) where cache["raw"]["level_name"] == "EMERGENCY"
          - set(attributes["app.request.id"], cache["raw"]["context"]["request_id"]) where cache["raw"]["context"]["request_id"] != nil
          - set(attributes["http.request.method"], cache["raw"]["context"]["method"]) where cache["raw"]["context"]["method"] != nil
          - set(attributes["http.route"], cache["raw"]["context"]["route"]) where cache["raw"]["context"]["route"] != nil
          - set(attributes["http.response.status_code"], cache["raw"]["context"]["status_code"]) where cache["raw"]["context"]["status_code"] != nil
          - set(attributes["url.full"], cache["raw"]["context"]["url"]) where cache["raw"]["context"]["url"] != nil
          - set(attributes["client.address"], cache["raw"]["context"]["ip"]) where cache["raw"]["context"]["ip"] != nil
          - set(attributes["user.id"], cache["raw"]["context"]["user_id"]) where cache["raw"]["context"]["user_id"] != nil
          - set(attributes["duration_ms"], cache["raw"]["context"]["duration_ms"]) where cache["raw"]["context"]["duration_ms"] != nil
          - set(attributes["app.supplier.id"], cache["raw"]["context"]["supplier_id"]) where cache["raw"]["context"]["supplier_id"] != nil
          - set(attributes["app.supplier.count"], cache["raw"]["context"]["supplier_count"]) where cache["raw"]["context"]["supplier_count"] != nil
          - set(attributes["app.log.type"], cache["raw"]["context"]["log_type"]) where cache["raw"]["context"]["log_type"] != nil
          - set(body, cache["raw"]["message"])
  resource/common:
    attributes:
      - action: upsert
        key: service.name
        value: otel-laravel-demo
      - action: upsert
        key: service.namespace
        value: otel-demo
      - action: upsert
        key: service.version
        value: ${env:APP_VERSION}
      - action: upsert
        key: deployment.environment.name
        value: ${env:APP_ENV}
  batch:
    timeout: 5s
    send_batch_size: 100

exporters:
  debug:
    verbosity: detailed

service:
  extensions: [file_storage]
  pipelines:
    logs:
      receivers: [filelog/laravel]
      processors: [transform/redact, transform/normalize, resource/common, batch]
      exporters: [debug]
